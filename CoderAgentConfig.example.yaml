# CoderAgent Configuration
#
# Copy this file to CoderAgentConfig.yaml and fill in your values.
# CoderAgentConfig.yaml is git-ignored so your token stays local.
#
# ──────────────────────────────────────────────────────────────────
# REQUIRED
# ──────────────────────────────────────────────────────────────────
#
# github_token
#   Your GitHub Fine-Grained Personal Access Token.
#
#   IMPORTANT: Classic PATs (ghp_…) are NOT supported.
#   You MUST use a Fine-Grained PAT (github_pat_…).
#
#   How to generate one:
#     1. Go to https://github.com/settings/personal-access-tokens/new
#     2. Give it a name, e.g. "CoderAgent"
#     3. Set an expiration date
#     4. Under "Permissions" click "add permissions" and select:
#          Copilot Requests
#     5. Click "Generate token" and paste it below
#
#   This token is also set as GITHUB_TOKEN env var when launching
#   the Copilot CLI, so you don't need to authenticate separately.

github_token: XXXXXXXXXXXXXXXXXX

